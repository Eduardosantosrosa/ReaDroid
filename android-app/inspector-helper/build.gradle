plugins {
    id 'com.android.application'
}

android {
    namespace 'org.readroid.deviceinspector'
    compileSdk 35

    defaultConfig {
        applicationId 'org.readroid.deviceinspector'
        minSdk 29
        targetSdk 29
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
