name: Android Build

on:
  push:
    paths:
      - 'reconstrucao_extreme_infinitv_1_9_0/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'reconstrucao_extreme_infinitv_1_9_0/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Test and Build APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: reconstrucao_extreme_infinitv_1_9_0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run JUnit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: cd reconstrucao_extreme_infinitv_1_9_0 && ./gradlew --no-daemon :app:connectedDebugAndroidTest

      - name: Build Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: readroid-extreme-debug
          path: reconstrucao_extreme_infinitv_1_9_0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build signed Release APK when signing secrets are configured
        id: release
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo 'Signing secrets not configured; skipping Release APK.'
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          ./gradlew --no-daemon :app:assembleRelease
          echo 'signed=true' >> "$GITHUB_OUTPUT"

      - name: Upload signed Release APK
        if: steps.release.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: readroid-extreme-release-signed
          path: reconstrucao_extreme_infinitv_1_9_0/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
