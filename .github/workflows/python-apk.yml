name: Python Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - reconstrucao-python
    paths:
      - "reconstrucao_python/**"
      - ".github/workflows/python-apk.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    env:
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake autopoint gettext

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install requests buildozer cython==0.29.34

      - name: Run reconstruction tests
        working-directory: reconstrucao_python
        run: python -m unittest discover -s tests -v

      - name: Build Android APK
        working-directory: reconstrucao_python
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: independent-tv-debug-apk
          path: reconstrucao_python/bin/*.apk
          if-no-files-found: error
